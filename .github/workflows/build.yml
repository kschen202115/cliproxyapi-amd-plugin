name: Build CLIProxyAPI AMD plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux ${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - name: Compile native plugin
        env:
          CGO_ENABLED: "1"
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="dev"; fi
          mkdir -p "dist/amd_${version}_linux_${{ matrix.goarch }}"
          go build -trimpath -buildmode=c-shared -ldflags="-s -w" -o "dist/amd_${version}_linux_${{ matrix.goarch }}/amd.so" .
          file "dist/amd_${version}_linux_${{ matrix.goarch }}/amd.so"
          (
            cd "dist/amd_${version}_linux_${{ matrix.goarch }}"
            zip -9 "../amd_${version}_linux_${{ matrix.goarch }}.zip" amd.so
          )
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: amd-linux-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    # CLIProxyAPI's GitHub plugin installer expects assets named
    # amd_<version>_linux_<arch>.zip and a checksums.txt file.
    if: github.ref_type == 'tag'
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum amd_*.zip > checksums.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/checksums.txt
